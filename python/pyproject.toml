[project]
name = "small-python"
version = "0.3.0"
description = "Run Small Python, a small embeddable Python runtime, from CPython."
readme = "README.md"
authors = [
    { name = "Ju Lin", email = "soasme@gmail.com" }
]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "csrc/licenses/*.txt"]
dependencies = []
classifiers = [
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]

[project.urls]
Repository = "https://github.com/soasme/small-python"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["small_python"]

[tool.setuptools.package-data]
small_python = ["py.typed", "*.pyi", "spy-worker", "spy-worker.exe"]

[tool.setuptools.exclude-package-data]
small_python = ["*.c"]

# One py3-none wheel per platform, built once: the package holds an executable,
# not an extension module. open() needs a POSIX host and the engine C11.
[tool.cibuildwheel]
build = "cp313-manylinux_* cp313-musllinux_* cp313-macosx_* cp313-win_amd64"
test-command = "python -m unittest discover -s {project}/python/tests"
