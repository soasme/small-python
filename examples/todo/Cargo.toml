[package]
name = "todo"
description = "A todo web application whose rules are written in Python"
version = "0.2.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8"
serde_json = "1"
small-python = { path = "../../rust/small-python", features = ["serde"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

# Its own workspace, apart from the crates in rust/.
[workspace]
