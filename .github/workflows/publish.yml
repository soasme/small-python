name: Publish

# Builds the small-python packages in python/, javascript/, rust/, and go/ and
# publishes them to PyPI, npm, crates.io, and the Go module proxy (a go/v* tag)
# when a version tag matching their versions is pushed.
# Files already published are skipped, so running it by hand on a branch adds
# what a release lacks, such as the wheel of a newly supported platform.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: python
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Set up Python
        run: uv python install

      - name: Check tag matches project version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv version --short)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $version" >&2
            exit 1
          fi

      - name: Build source distribution
        run: uv build --sdist

      - name: Check source distribution
        run: uvx twine check --strict dist/*

      - name: Upload source distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-sdist
          path: python/dist/

  wheels:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Configured by [tool.cibuildwheel] in python/pyproject.toml; each wheel
      # is tested with python/tests.
      - name: Build wheels
        uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae # v4.2.1
        with:
          package-dir: python
          output-dir: wheelhouse

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish:
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write # trusted publishing to PyPI
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true

  # Trusted publishing: npm trusts this workflow and the npm environment
  # (npmjs.com package settings), so no token is stored.
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p 'require("./javascript/package.json").version')"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - name: Build and test the WebAssembly worker
        run: |
          curl -sSfL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz | tar xz -C "$RUNNER_TEMP"
          make test-javascript WASI_SDK="$RUNNER_TEMP/wasi-sdk-34.0-x86_64-linux"

      - name: Publish to npm
        working-directory: javascript
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ -n "$(npm view "small-python@$version" version)" ]; then
            echo "small-python@$version is already on npm"
          else
            npm publish
          fi

  # The crates in rust/ (docs/packaging/rust.md), in dependency order. A crate
  # must exist before crates.io can trust a workflow, so the first release
  # authenticates with the CARGO_REGISTRY_TOKEN secret of the crates-io
  # environment; once trusted publishing is configured for each crate
  # (repository soasme/small-python, workflow publish.yml, environment
  # crates-io), delete the secret and the workflow exchanges its OIDC token.
  crates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        run: rustup update stable && rustup default stable

      - name: Check tag matches crate version
        working-directory: rust
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "small-python") | .version')"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match crate version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # The tests build from the checkout; small-python-src then carries a copy
      # of the C sources.
      - name: Test the crates and the todo example
        run: make test-rust

      - name: Copy the C sources into small-python-src
        run: make rust-vendor

      - name: Authenticate with trusted publishing
        id: auth
        if: env.CARGO_REGISTRY_TOKEN == ''
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish to crates.io
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          for crate in small-python-src small-python-sys small-python small-python-worker; do
            status="$(curl -s -o /dev/null -w '%{http_code}' -A 'small-python publish workflow (github.com/soasme/small-python)' \
              "https://crates.io/api/v1/crates/$crate/$VERSION")"
            if [ "$status" = 200 ]; then
              echo "$crate@$VERSION is already on crates.io"
            elif [ "$crate" = small-python-src ]; then
              # csrc/ is ignored by git: the copy make rust-vendor just made.
              cargo publish -p "$crate" --allow-dirty
            else
              cargo publish -p "$crate"
            fi
          done

  # The module in go/ (docs/packaging/go.md). Go fetches a module in a
  # subdirectory from a go/vX.Y.Z tag, so this commits the C sources
  # make go-vendor copies, which main never carries, on top of the tagged
  # commit and tags that commit.
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Check tag matches engine version
        run: |
          version="$(sed -n 's/^#define SPY_VERSION "\(.*\)"$/\1/p' spy.h)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match engine version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Test the module
        run: make test-go

      - name: Tag the module with its C sources
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/go/v$VERSION" >/dev/null; then
            echo "go/v$VERSION already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f go/LICENSE go/licenses go/spy
          git commit -m "Go module v$VERSION with the C sources"
          git tag "go/v$VERSION"
          git push origin "go/v$VERSION"
