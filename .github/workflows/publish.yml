name: Publish

# Builds the small-python packages in python/, javascript/, rust/, go/, and
# java/ and publishes them to PyPI, npm, crates.io, the Go module proxy (a
# go/v* tag), and Maven Central when a version tag matching their versions is
# pushed. A tag also gets a
# GitHub release carrying spy, spyc, and spy-worker for each platform.
# Files already published are skipped, so running it by hand on a branch adds
# what a release lacks, such as the wheel of a newly supported platform.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: python
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: python/uv.lock

      - name: Set up Python
        run: uv python install

      - name: Check tag matches project version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv version --short)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $version" >&2
            exit 1
          fi

      - name: Build source distribution
        run: uv build --sdist

      - name: Check source distribution
        run: uvx twine check --strict dist/*

      - name: Upload source distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-sdist
          path: python/dist/

  wheels:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Configured by [tool.cibuildwheel] in python/pyproject.toml; each wheel
      # is tested with python/tests.
      - name: Build wheels
        uses: pypa/cibuildwheel@e090b81e30c4d855ea63bf4b6e59204c09a101ae # v4.2.1
        with:
          package-dir: python
          output-dir: wheelhouse

      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  publish:
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write # trusted publishing to PyPI
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true

  # Trusted publishing: npm trusts this workflow and the npm environment
  # (npmjs.com package settings), so no token is stored.
  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p 'require("./javascript/package.json").version')"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi

      - name: Build and test the WebAssembly worker
        run: |
          curl -sSfL https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz | tar xz -C "$RUNNER_TEMP"
          make test-javascript WASI_SDK="$RUNNER_TEMP/wasi-sdk-34.0-x86_64-linux"

      - name: Publish to npm
        working-directory: javascript
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ -n "$(npm view "small-python@$version" version)" ]; then
            echo "small-python@$version is already on npm"
          else
            npm publish
          fi

  # The crates in rust/ (docs/packaging/rust.md), in dependency order. A crate
  # must exist before crates.io can trust a workflow, so the first release
  # authenticates with the CARGO_REGISTRY_TOKEN secret of the crates-io
  # environment; once trusted publishing is configured for each crate
  # (repository soasme/small-python, workflow publish.yml, environment
  # crates-io), delete the secret and the workflow exchanges its OIDC token.
  crates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        run: rustup update stable && rustup default stable

      - name: Check tag matches crate version
        working-directory: rust
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "small-python") | .version')"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match crate version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # The tests build from the checkout; small-python-src then carries a copy
      # of the C sources.
      - name: Test the crates and the todo example
        run: make test-rust

      - name: Copy the C sources into small-python-src
        run: make rust-vendor

      - name: Authenticate with trusted publishing
        id: auth
        if: env.CARGO_REGISTRY_TOKEN == ''
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish to crates.io
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          for crate in small-python-src small-python-sys small-python small-python-worker; do
            status="$(curl -s -o /dev/null -w '%{http_code}' -A 'small-python publish workflow (github.com/soasme/small-python)' \
              "https://crates.io/api/v1/crates/$crate/$VERSION")"
            if [ "$status" = 200 ]; then
              echo "$crate@$VERSION is already on crates.io"
            elif [ "$crate" = small-python-src ]; then
              # csrc/ is ignored by git: the copy make rust-vendor just made.
              cargo publish -p "$crate" --allow-dirty
            else
              cargo publish -p "$crate"
            fi
          done

  # The module in go/ (docs/packaging/go.md). Go fetches a module in a
  # subdirectory from a go/vX.Y.Z tag, so this commits the C sources
  # make go-vendor copies, which main never carries, on top of the tagged
  # commit and tags that commit.
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Check tag matches engine version
        run: |
          version="$(sed -n 's/^#define SPY_VERSION "\(.*\)"$/\1/p' spy.h)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match engine version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Test the module
        run: make test-go

      - name: Tag the module with its C sources
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/go/v$VERSION" >/dev/null; then
            echo "go/v$VERSION already exists"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f go/LICENSE go/licenses go/spy
          git commit -m "Go module v$VERSION with the C sources"
          git tag "go/v$VERSION"
          git push origin "go/v$VERSION"

  # The native files of the Java artifacts (docs/packaging/java.md 6), built
  # and tested on each platform. Linux builds the JNI library in a
  # manylinux_2_28 container, so it needs only glibc 2.28, and the worker
  # statically on the runner; macOS targets 11.0, as the wheels do.
  java-native:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux-x86_64, manylinux: quay.io/pypa/manylinux_2_28_x86_64, make: CC=gcc LDFLAGS=-static }
          - { os: ubuntu-24.04-arm, platform: linux-arm64, manylinux: quay.io/pypa/manylinux_2_28_aarch64, make: CC=gcc LDFLAGS=-static }
          - { os: macos-latest, platform: macos-arm64 }
          - { os: macos-15-intel, platform: macos-x86_64 }
          - { os: windows-latest, platform: windows-x86_64, make: CC=gcc LDFLAGS=-static JNI_LDFLAGS=-static }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build the JNI library for glibc 2.28
        if: matrix.manylinux
        run: |
          docker run --rm -v "$PWD:/src" -w /src ${{ matrix.manylinux }} bash -c '
            dnf install -y -q java-17-openjdk-devel &&
            make JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")" \
              java/small-python/native/${{ matrix.platform }}/libspyjni.so'
          sudo chown -R "$(id -u):$(id -g)" java

      - name: Build and test
        run: make ${{ matrix.make }} test-java

      - name: Upload the native files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: java-native-${{ matrix.platform }}
          path: java/*/native/
          if-no-files-found: error

  # The jars, with every platform's native files, to Maven Central through
  # the Central Portal. The maven-central environment holds a Portal user
  # token for the namespace io.github.soasme (MAVEN_CENTRAL_USERNAME and
  # MAVEN_CENTRAL_PASSWORD) and the signing key (MAVEN_GPG_PRIVATE_KEY and
  # MAVEN_GPG_PASSPHRASE).
  java:
    needs: java-native
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: maven-central
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Check tag matches project version
        working-directory: java
        run: |
          version="$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match project version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Download the native files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: java-native-*
          merge-multiple: true
          path: java/

      - name: Check every platform is there
        run: |
          make java/licenses/LICENSE java/licenses/python.txt java/licenses/unicode.txt
          for platform in linux-x86_64 linux-arm64 macos-arm64 macos-x86_64 windows-x86_64; do
            case "$platform" in
              linux-*) library=libspyjni.so worker=spy-worker ;;
              macos-*) library=libspyjni.dylib worker=spy-worker ;;
              windows-*) library=spyjni.dll worker=spy-worker.exe ;;
            esac
            ls "java/small-python/native/$platform/$library" "java/small-python-worker/native/$platform/$worker"
          done

      - name: Publish to Maven Central
        working-directory: java
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          url="https://repo1.maven.org/maven2/io/github/soasme/small-python/$VERSION/small-python-$VERSION.pom"
          if [ "$(curl -s -o /dev/null -w '%{http_code}' "$url")" = 200 ]; then
            echo "io.github.soasme:small-python:$VERSION is already on Maven Central"
          else
            mvn -B -P release -DskipTests deploy
          fi

  # spy, spyc, and spy-worker for each platform, packed with the licenses.
  # Linux and Windows link statically, so the executables need no shared
  # library beyond the system's; Windows builds with the runner's MinGW-w64
  # GCC, as MSVC has no C11 complex numbers. An archive also holds the
  # headers and libraries spyc builds executables with, and each tool is
  # run from the staged archive (tools/archive.sh) before it is packed.
  binaries:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux-x86_64, ldflags: -static }
          - { os: ubuntu-24.04-arm, platform: linux-arm64, ldflags: -static }
          - { os: macos-latest, platform: macos-arm64 }
          - { os: macos-15-intel, platform: macos-x86_64 }
          - { os: windows-latest, platform: windows-x86_64, ldflags: -static, exe: .exe }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check tag matches engine version
        run: |
          version="$(sed -n 's/^#define SPY_VERSION "\(.*\)"$/\1/p' spy.h)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match engine version $version" >&2
            exit 1
          fi
          echo "NAME=small-python-$version-${{ matrix.platform }}" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'

      - name: Build
        run: make CC=gcc LDFLAGS='${{ matrix.ldflags }}' spy bin/spyc spy-worker libspy.a libspy-std.a
        if: runner.os != 'macOS'

      - name: Build
        run: make spy bin/spyc spy-worker libspy.a libspy-std.a
        if: runner.os == 'macOS'

      - name: Stage and check
        run: tools/archive.sh "$NAME" "${{ matrix.exe }}"

      - name: Pack
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "$NAME.zip" "$NAME"
          else
            tar czf "$NAME.tar.gz" "$NAME"
          fi

      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.platform }}
          # Only the archive: the staging directory's name also contains dots.
          path: ${{ env.NAME }}.${{ runner.os == 'Windows' && 'zip' || 'tar.gz' }}

  # Creates the release of the pushed tag, or adds the archives a release
  # lacks when one already exists.
  release:
    needs: binaries
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist/

      - name: Checksum archives
        working-directory: dist
        run: sha256sum small-python-*.tar.gz small-python-*.zip > SHA256SUMS

      - name: Publish GitHub release
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            prerelease=
            case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; esac
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME" $prerelease
          fi
