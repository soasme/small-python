name: C11 runtime
on: [push, pull_request]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [clang, gcc]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - run: make CC=${{ matrix.compiler }} CFLAGS='-O2 -std=c11 -Wall -Wextra -Wpedantic -Werror' test
      - run: make docs
      - run: make CC=${{ matrix.compiler }} sanitize
        if: runner.os == 'Linux'

  packages:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install wasi-sdk
        run: |
          case "${{ runner.os }}-$(uname -m)" in
            Linux-x86_64) asset=x86_64-linux ;;
            macOS-arm64) asset=arm64-macos ;;
            *) asset=x86_64-macos ;;
          esac
          curl -sSfL "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-$asset.tar.gz" | tar xz
          echo "WASI_SDK=$PWD/wasi-sdk-34.0-$asset" >> "$GITHUB_ENV"
      - run: make test-binding
      - run: make test-javascript

  # The Python package on Windows; its worker is built with the runner's
  # MinGW-w64 GCC (python/setup.py).
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: gcc --version
      - run: pip install ./python
      - run: python -m unittest discover -s python/tests

  upstream-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - run: python3 tests/fetch_upstream.py cython
      - run: make run-cython
      - name: Check selected upstream boolean-expression tests
        run: python3 tests/run_cython.py --select boolop_py.py --report tests/results/cython-boolop.json
      - name: Record full known-failing pure-Python baseline
        run: make cython-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cython-baseline
          path: tests/results/*.json

  standard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - run: python3 tests/fetch_upstream.py cpython
      - run: make docs

  cpython-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15'
      - run: make oracle run-cython
      - name: Validate the specification tests against the pinned oracle
        run: make test-spec-oracle
      - name: Check Unicode properties and representations against the pinned oracle
        run: make test-unicode
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpython-baseline
          path: tests/results/spec.json
